[package]
name = "webseek"
version = "0.3.0"
edition = "2021"
# Bumped to match the locked dependency graph (clap 4.6 requires 1.85) and the
# std file-locking APIs used by the cache (stable since 1.89).
rust-version = "1.89"
description = "API-key-free web search & page fetch CLI designed for AI agents"
license = "MIT"
keywords = ["search", "cli", "web", "agent", "scrape"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
ego-tree = "0.6"
encoding_rs = "0.8"
open = "5"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "rustls-tls",
] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
# Only for `spawn_blocking` inside the egress-checking DNS resolver; reqwest
# already brings tokio in.
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
