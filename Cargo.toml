[package]
name = "webseek"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "API-key-free web search & page fetch CLI designed for AI agents"
license = "MIT"
keywords = ["search", "cli", "web", "agent", "scrape"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
ego-tree = "0.6"
open = "5"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "gzip",
    "rustls-tls",
    "json",
] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
