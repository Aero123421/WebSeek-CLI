name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships a binary whose `--version`
      # contradicts the release it came from. Catch it before anything builds.
      - name: Tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "Releasing v$crate"

      - name: Changelog has an entry for this version
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if ! grep -qF "## [$crate]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$crate]' section" >&2
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add cross-compilation target
        if: matrix.cross
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Test release platform
        if: ${{ !matrix.cross }}
        run: cargo test --locked --release --all-features

      - name: Smoke-test release binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/webseek"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "$bin" --version
          "$bin" engines --json > /dev/null

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/webseek-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" webseek

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -LiteralPath "target\${{ matrix.target }}\release\webseek.exe" -DestinationPath "dist\webseek-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: webseek-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md — the release notes come from the repository,
      # not from the artifacts.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      # The hand-written changelog is the release notes. Auto-generated commit
      # lists were being published instead, so CHANGELOG.md never reached a
      # single user.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/     { exit }
            capture                 { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No changelog section for $version; falling back to generated notes." >&2
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release/* --clobber
          elif [ -s NOTES.md ]; then
            gh release create "${{ github.ref_name }}" release/* \
              --notes-file NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "${{ github.ref_name }}" release/* \
              --generate-notes --target "$GITHUB_SHA"
          fi
