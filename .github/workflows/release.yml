name: Release

on:
  push:
    tags:
      - "v*"

# No blanket `contents: write` — only the `publish` job needs it (to create
# the GitHub Release). `quality` and `build` only read the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail fast on a mistagged release: `v9.9.9` must not be able to
      # build and publish a package that still says 0.2.0 internally.
      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${pkg_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false
    runs-on: ${{ matrix.os }}
    env:
      # Only consulted by Cargo when actually building that target triple;
      # harmless for every other row in the matrix.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Add cross-compilation target
        if: matrix.cross
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Test release platform
        if: ${{ !matrix.cross }}
        run: cargo test --locked --release --all-features

      - name: Smoke-test the built binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/webseek"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "$bin" --version
          "$bin" engines --json > /dev/null

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/webseek-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" webseek

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -LiteralPath "target\${{ matrix.target }}\release\webseek.exe" -DestinationPath "dist\webseek-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: webseek-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release/* --clobber
          else
            gh release create "${{ github.ref_name }}" release/* --generate-notes --target "$GITHUB_SHA"
          fi
